name: Lean build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
      - name: Check axioms of headline theorems
        run: |
          for f in PastaMath/TautThreshold/Axioms.lean PastaMath/MWThreshold/Axioms.lean; do
            lake env lean "$f" > axioms.out
            cat axioms.out
            n="$(grep -c '^#print axioms' "$f")"
            test "$(grep -c 'depends on axioms: \[propext, Classical.choice, Quot.sound\]' axioms.out)" -eq "$n"
            test "$(grep -c 'depends on axioms' axioms.out)" -eq "$n"
          done
      - name: Check for forbidden constructs
        run: |
          if grep -rnwE 'sorry|admit|native_decide|axiom|implemented_by' --include='*.lean' PastaMath PastaMath.lean | grep -v '#print axioms'; then
            echo "forbidden construct found"; exit 1
          fi
          if grep -rnE '^import Mathlib\.Tactic$' --include='*.lean' PastaMath PastaMath.lean; then
            echo "umbrella Mathlib.Tactic import found"; exit 1
          fi
